<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mayan Medical Group — Solicitudes</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }
    .container { max-width: 780px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 1.5rem; }
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
    .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn-refresh { padding: 7px 14px; border-radius: 8px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 13px; }
    .btn-google { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 8px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 13px; font-weight: 500; color: #333; }
    .connected-badge { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 8px; background: #EAF3DE; font-size: 13px; color: #27500A; font-weight: 500; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.5rem; }
    .stat { border-radius: 10px; padding: 14px 16px; }
    .stat p:first-child { font-size: 13px; margin-bottom: 4px; }
    .stat p:last-child { font-size: 26px; font-weight: 500; }
    .stat.pendiente { background: #FAEEDA; color: #633806; }
    .stat.confirmado { background: #EAF3DE; color: #27500A; }
    .stat.rechazado { background: #FCEBEB; color: #791F1F; }
    .stat.cancelado { background: #e8e8e8; color: #444; display: flex; justify-content: space-between; align-items: center; grid-column: span 3; padding: 10px 16px; }
    .stat.cancelado p:last-child { font-size: 20px; }
    .filters { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd; background: transparent; cursor: pointer; font-size: 13px; color: #333; }
    .filter-btn.active { background: #eee; font-weight: 500; }
    .cards { display: flex; flex-direction: column; gap: 10px; }
    .card { background: white; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: border-color 0.15s; }
    .card:hover { border-color: #bbb; }
    .card-left { flex: 1; min-width: 0; }
    .card-title { font-weight: 500; font-size: 15px; margin-bottom: 4px; }
    .card-sub { font-size: 13px; color: #666; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .cal-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
    .cal-chip.synced  { background: #EAF3DE; color: #27500A; }
    .cal-chip.pending { background: #FFF3CD; color: #7a5200; }
    .card-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .badge { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
    .badge.pendiente  { background: #FAEEDA; color: #633806; }
    .badge.confirmado { background: #EAF3DE; color: #27500A; }
    .badge.rechazado  { background: #FCEBEB; color: #791F1F; }
    .badge.cancelado  { background: #e8e8e8; color: #555; }
    .chevron { color: #999; font-size: 18px; }
    .empty   { text-align: center; color: #999; font-size: 14px; padding: 2rem; }
    .loading { text-align: center; color: #999; font-size: 14px; padding: 2rem; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal { background: white; border-radius: 16px; border: 1px solid #e5e5e5; width: min(660px, 100%); max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
    .modal-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .modal-header-left p:first-child { font-size: 17px; font-weight: 500; }
    .modal-header-left p:last-child  { font-size: 13px; color: #666; margin-top: 2px; }
    .modal-header-right { display: flex; align-items: center; gap: 8px; }
    .btn-close { background: none; border: none; cursor: pointer; font-size: 20px; color: #999; padding: 0 4px; line-height: 1; }
    .modal-body { overflow-y: auto; padding: 1.25rem 1.5rem; flex: 1; }
    .section-label { font-size: 13px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: 0.8px; margin: 16px 0 10px; }
    .section-label:first-child { margin-top: 0; }
    .row { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .row-label { color: #666; min-width: 180px; flex-shrink: 0; }
    .row-value { color: #1a1a1a; flex: 1; }
    .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid #eee; }
    .warning-box { font-size: 13px; color: #633806; background: #FAEEDA; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
    .info-box    { font-size: 12px; color: #185FA5; background: #E6F1FB; border-radius: 8px; padding: 6px 12px; margin-bottom: 10px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
    .btn-reject  { padding: 8px 20px; border-radius: 8px; border: 1px solid #ddd; background: #FCEBEB; color: #791F1F; cursor: pointer; font-weight: 500; font-size: 14px; }
    .btn-confirm { padding: 8px 20px; border-radius: 8px; border: 1px solid #aad4a0; background: #EAF3DE; color: #27500A; cursor: pointer; font-weight: 500; font-size: 14px; }
    .btn-confirm:disabled { background: #f0f0f0; color: #aaa; border-color: #ddd; cursor: not-allowed; }
    .btn-edit    { padding: 8px 20px; border-radius: 8px; border: 1px solid #c5b8e8; background: #f0ecfb; color: #4a2d99; cursor: pointer; font-weight: 500; font-size: 14px; }
    .btn-cancel  { padding: 8px 20px; border-radius: 8px; border: 1px solid #ccc; background: #f0f0f0; color: #444; cursor: pointer; font-weight: 500; font-size: 14px; }

    .edit-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
    .edit-modal { background: white; border-radius: 16px; border: 1px solid #e5e5e5; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 14px; }
    .edit-modal h3 { font-size: 17px; font-weight: 600; padding-bottom: 10px; border-bottom: 1px solid #eee; }
    .edit-field { display: flex; flex-direction: column; gap: 5px; }
    .edit-field label { font-size: 13px; color: #555; font-weight: 500; }
    .edit-field input, .edit-field select, .edit-field textarea { padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; font-family: inherit; color: #1a1a1a; background: white; }
    .edit-field input:focus, .edit-field select:focus, .edit-field textarea:focus { outline: none; border-color: #97c6e5; box-shadow: 0 0 0 3px rgba(151,198,229,0.2); }
    .edit-field textarea { min-height: 72px; resize: vertical; }
    .edit-actions { display: flex; gap: 10px; justify-content: flex-end; padding-top: 4px; border-top: 1px solid #eee; }
    .btn-save { padding: 8px 20px; border-radius: 8px; border: 1px solid #aad4a0; background: #EAF3DE; color: #27500A; cursor: pointer; font-weight: 500; font-size: 14px; }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 300; white-space: nowrap; border: 1px solid; }
    .toast.success { background: #EAF3DE; color: #27500A; border-color: #C0DD97; }
    .toast.danger  { background: #FCEBEB; color: #791F1F; border-color: #F7C1C1; }
    .toast.info    { background: #E6F1FB; color: #185FA5; border-color: #B5D4F4; }
  </style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <div>
      <h1>Solicitudes de programación</h1>
      <p class="subtitle">Mayan Medical Group</p>
    </div>
    <div class="top-actions">
      <button class="btn-refresh" onclick="fetchSheet()">↻ Actualizar</button>
      <div id="gauth-area">
        <button class="btn-google" onclick="handleGoogleLogin()">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Conectar Google Calendar
        </button>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat pendiente"><p>Pendientes</p><p id="cnt-pendiente">0</p></div>
    <div class="stat confirmado"><p>Confirmadas</p><p id="cnt-confirmado">0</p></div>
    <div class="stat rechazado"><p>Rechazadas</p><p id="cnt-rechazado">0</p></div>
    <div class="stat cancelado"><p>Canceladas</p><p id="cnt-cancelado">0</p></div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFiltro('todas', this)">Todas</button>
    <button class="filter-btn" onclick="setFiltro('pendiente', this)">Pendiente</button>
    <button class="filter-btn" onclick="setFiltro('confirmado', this)">Confirmado</button>
    <button class="filter-btn" onclick="setFiltro('rechazado', this)">Rechazado</button>
    <button class="filter-btn" onclick="setFiltro('cancelado', this)">Cancelado</button>

  <div class="cards" id="cards"><p class="loading">Cargando solicitudes...</p></div>
</div>

<!-- DETAIL MODAL -->
<div class="overlay" id="modal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-header-left">
        <p id="m-titulo"></p>
        <p id="m-cirujano"></p>
      </div>
      <div class="modal-header-right">
        <span class="badge" id="m-badge"></span>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="edit-overlay" id="edit-modal" style="display:none">
  <div class="edit-modal">
    <h3>✏️ Editar solicitud</h3>
    <div class="edit-field"><label>Nombre de cirugía</label><input id="e-nombre" type="text" /></div>
    <div class="edit-field"><label>Fecha (DD/MM/AAAA)</label><input id="e-fecha" type="text" placeholder="19/05/2026" /></div>
    <div class="edit-field"><label>Horario</label><input id="e-horario" type="text" placeholder="08:00" /></div>
    <div class="edit-field"><label>Horas de quirófano</label>
      <select id="e-horas"><option>1 hora</option><option>2 horas</option><option>3 horas</option><option>4 horas</option><option>5 horas</option><option>15 minutos</option></select>
    </div>
    <div class="edit-field"><label>Hospitalización</label>
      <select id="e-hospitalizacion"><option>Ambulatoria</option><option>1 noche</option><option>2 noches</option><option>3 noches</option></select>
    </div>
    <div class="edit-field"><label>Cirujano responsable</label><input id="e-cirujano" type="text" /></div>
    <div class="edit-field"><label>Anestesiólogo/a</label><input id="e-anestesiologo" type="text" /></div>
    <div class="edit-field"><label>Notas / Motivo del cambio</label><textarea id="e-notas" placeholder="Ej: Médico solicitó cambio de fecha..."></textarea></div>
    <div class="edit-actions">
      <button class="btn-reject" onclick="closeEdit()">Cancelar</button>
      <button class="btn-save" onclick="saveEdit()">💾 Guardar cambios</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" style="display:none"></div>

<script>
const CLIENT_ID  = "306291411851-no6b8u0u4imn7phjfkg276po7e2i024h.apps.googleusercontent.com";
const SCOPES     = "https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/userinfo.email";
const SHEET_ID   = "17uhp0IbMb_bToeJs-z7MOSNTefEjoMWuLN9A2D-r6Es";
const SHEET_NAME = "Respuestas de formulario 1";
const CUTOFF     = new Date("2026-06-05");

let solicitudes   = [];
let overrides     = {};   // { id: "confirmado"|"rechazado"|"cancelado" }
let editOverrides = {};   // { id: { ...campos editados } }
let calSynced     = {};   // { id: true } — eventos ya creados en Calendar
let calQueue      = [];   // [ id, ... ] — pendientes de sincronizar
let filtroActual  = "todas";
let accessToken   = null;
let tokenClient   = null;
let gReady        = false;
let gUser         = null;
let toastTimer    = null;
let renewalTimer  = null;
let editingId     = null;

// ── Persistencia ──────────────────────────────────────────────────────────────
function saveState() {
  try {
    localStorage.setItem("mmg_overrides",     JSON.stringify(overrides));
    localStorage.setItem("mmg_editOverrides", JSON.stringify(editOverrides));
    localStorage.setItem("mmg_calSynced",     JSON.stringify(calSynced));
    localStorage.setItem("mmg_calQueue",      JSON.stringify(calQueue));
  } catch(e) {}
}
function loadState() {
  try {
    overrides     = JSON.parse(localStorage.getItem("mmg_overrides")     || "{}");
    editOverrides = JSON.parse(localStorage.getItem("mmg_editOverrides") || "{}");
    calSynced     = JSON.parse(localStorage.getItem("mmg_calSynced")     || "{}");
    calQueue      = JSON.parse(localStorage.getItem("mmg_calQueue")      || "[]");
  } catch(e) { overrides = {}; editOverrides = {}; calSynced = {}; calQueue = []; }
}

// ── Parse sheet ───────────────────────────────────────────────────────────────
function parseSheetRows(rows) {
  if (!rows || rows.length < 2) return [];
  const headers = rows[0];
  const get = (row, name) => {
    const i = headers.findIndex(h => h && h.toLowerCase().includes(name.toLowerCase()));
    return i >= 0 ? (row[i] || "").trim() : "";
  };
  return rows.slice(1).filter(r => r.some(c => c)).map((row, idx) => {
    const marca = get(row, "Marca temporal");
    const submitDate = marca ? new Date(marca.replace(/(\d+)\/(\d+)\/(\d+)/, "$3-$2-$1")) : new Date(0);
    return {
      id: idx + 1,
      status: submitDate < CUTOFF ? "confirmado" : "pendiente",
      nombreCirugia:   get(row, "Nombre de cirugía"),
      fecha:           get(row, "Fecha"),
      horario:         get(row, "Horario").replace(":00:00","").replace(" a.m.","").replace(" p.m.",""),
      horasQuirofano:  get(row, "Horas de quirófano"),
      hospitalizacion: get(row, "Tiempo de hospitalización"),
      anestesia:       get(row, "Tipo de anestesia"),
      contaminada:     get(row, "¿Su cirugía es contaminada?"),
      paciente:        get(row, "Nombre del paciente"),
      edadPaciente:    get(row, "Edad del paciente"),
      cirujano:        get(row, "Cirujano/a responsable"),
      ayudante:        get(row, "Cirujano/a ayudante"),
      anestesiologo:   get(row, "Anestesiólogo/a"),
      pagos:           get(row, "¿Quién realizará los pagos?"),
      tipoCirugia:     get(row, "Tipo de cirugia"),
      suturas:         get(row, "¿Qué suturas necesita"),
      drenaje:         get(row, "¿Requiere alguna drenaje"),
      insumos:         get(row, "¿Requiere agregar algún insumo"),
      laparoscopia:    get(row, "Selecciona lo que requieres"),
      email:           get(row, "Correo electronico"),
      notas:           ""
    };
  });
}

// ── Fetch sheet ───────────────────────────────────────────────────────────────
async function fetchSheet() {
  document.getElementById("cards").innerHTML = '<p class="loading">Cargando solicitudes...</p>';
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
    const res  = await fetch(url);
    const text = await res.text();
    const rows = text.split("\n").map(r => {
      const result = []; let cur = "", inQ = false;
      for (let i = 0; i < r.length; i++) {
        const c = r[i];
        if (c === '"') { if (inQ && r[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
        else if (c === ',' && !inQ) { result.push(cur.trim()); cur = ""; }
        else cur += c;
      }
      result.push(cur.trim());
      return result;
    });
    solicitudes = parseSheetRows(rows);
    // Aplicar editOverrides a los datos
    solicitudes = solicitudes.map(s => editOverrides[s.id] ? { ...s, ...editOverrides[s.id] } : s);
    render();
  } catch(e) {
    document.getElementById("cards").innerHTML = '<p class="empty">Error al cargar datos.</p>';
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function getStatus(s) { return overrides[s.id] || s.status; }

function row(label, value) {
  if (!value) return "";
  return `<div class="row"><span class="row-label">${label}</span><span class="row-value">${value}</span></div>`;
}

function buildCalEvent(s) {
  const hNum     = parseInt((s.horario || "08:00").split(":")[0]) || 8;
  const mRaw     = (s.horario || "08:00").split(":")[1] || "00";
  const endH     = String(hNum + Math.ceil(parseFloat(s.horasQuirofano) || 2)).padStart(2,"0");
  const parts    = (s.fecha || "").split("/");
  const fechaISO = parts.length === 3 ? `${parts[2]}-${parts[1].padStart(2,"0")}-${parts[0].padStart(2,"0")}` : s.fecha;
  return {
    summary:     `🏥 ${s.nombreCirugia} — ${s.paciente}`,
    description: `PROCEDIMIENTO\nTipo: ${s.tipoCirugia}\nNombre: ${s.nombreCirugia}\nQuirófano: ${s.horasQuirofano}\nAnestesia: ${s.anestesia}\nHospitalización: ${s.hospitalizacion}\nContaminada: ${s.contaminada}\n\nPACIENTE\nNombre: ${s.paciente}\nEdad: ${s.edadPaciente}\n\nEQUIPO MÉDICO\nCirujano: ${s.cirujano}\nAyudante: ${s.ayudante}\nAnestesiólogo: ${s.anestesiologo}\nEmail: ${s.email}\nPagos: ${s.pagos}\n\nMATERIALES\nSuturas: ${s.suturas}\nDrenaje: ${s.drenaje}\nInsumos: ${s.insumos}\nLaparoscopia: ${s.laparoscopia}`,
    colorId:     "11",
    start:       { dateTime: `${fechaISO}T${String(hNum).padStart(2,"0")}:${mRaw}:00`, timeZone: "America/Cancun" },
    end:         { dateTime: `${fechaISO}T${endH}:${mRaw}:00`, timeZone: "America/Cancun" },
    attendees:   s.email ? [{ email: s.email }] : [],
    sendUpdates: "all"
  };
}

// ── Cola de sincronización ────────────────────────────────────────────────────
async function processQueue() {
  if (!gReady || !accessToken || calQueue.length === 0) return;
  const pending = [...calQueue];
  let synced = 0;
  for (const id of pending) {
    const s = solicitudes.find(x => x.id === id);
    if (!s) { calQueue = calQueue.filter(x => x !== id); continue; }
    try {
      const res = await fetch(
        "https://www.googleapis.com/calendar/v3/calendars/primary/events?sendUpdates=all",
        { method: "POST", headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" }, body: JSON.stringify(buildCalEvent(s)) }
      );
      if (res.ok) {
        calSynced[id] = true;
        calQueue = calQueue.filter(x => x !== id);
        synced++;
      }
    } catch(e) {}
  }
  saveState();
  if (synced > 0) { render(); showToast(`📅 ${synced} evento(s) sincronizados con Calendar.`, "success"); }
}

// ── Render cards ──────────────────────────────────────────────────────────────
function render() {
  const list = filtroActual === "todas" ? solicitudes : solicitudes.filter(s => getStatus(s) === filtroActual);
  document.getElementById("cnt-pendiente").textContent  = solicitudes.filter(s => getStatus(s) === "pendiente").length;
  document.getElementById("cnt-confirmado").textContent = solicitudes.filter(s => getStatus(s) === "confirmado").length;
  document.getElementById("cnt-rechazado").textContent  = solicitudes.filter(s => getStatus(s) === "rechazado").length;
  document.getElementById("cnt-cancelado").textContent  = solicitudes.filter(s => getStatus(s) === "cancelado").length;
  const labels = { pendiente:"Pendiente", confirmado:"Confirmado", rechazado:"Rechazado", cancelado:"Cancelado" };
  const container = document.getElementById("cards");
  if (list.length === 0) { container.innerHTML = '<p class="empty">No hay solicitudes en esta categoría.</p>'; return; }
  container.innerHTML = list.map(s => {
    const st = getStatus(s);
    let calChip = "";
    if (st === "confirmado") {
      calChip = calSynced[s.id]
        ? `<span class="cal-chip synced">📅 En Calendar</span>`
        : `<span class="cal-chip pending">⏳ Sin sincronizar</span>`;
    }
    return `
      <div class="card" onclick="openModal(${s.id})">
        <div class="card-left">
          <p class="card-title">${s.nombreCirugia || "Sin nombre"}</p>
          <p class="card-sub">${s.cirujano} · ${s.fecha} · ${s.horario} · ${s.paciente}</p>
        </div>
        <div class="card-right">
          ${calChip}
          <span class="badge ${st}">${labels[st]}</span>
          <span class="chevron">›</span>
        </div>
      </div>`;
  }).join("");
}

// ── Detail modal ──────────────────────────────────────────────────────────────
function openModal(id) {
  const s = solicitudes.find(x => x.id === id);
  const status = getStatus(s);
  document.getElementById("m-titulo").textContent   = s.nombreCirugia;
  document.getElementById("m-cirujano").textContent = s.cirujano;
  const badge = document.getElementById("m-badge");
  badge.textContent = { pendiente:"Pendiente", confirmado:"Confirmado", rechazado:"Rechazado", cancelado:"Cancelado" }[status];
  badge.className   = "badge " + status;
  document.getElementById("modal-body").innerHTML = `
    <p class="section-label">Datos del procedimiento</p>
    ${row("Tipo de cirugía", s.tipoCirugia)}
    ${row("Nombre de cirugía", s.nombreCirugia)}
    ${row("Fecha", s.fecha)}
    ${row("Horario", s.horario)}
    ${row("Horas de quirófano", s.horasQuirofano)}
    ${row("Hospitalización", s.hospitalizacion)}
    ${row("Tipo de anestesia", s.anestesia)}
    ${row("¿Cirugía contaminada?", s.contaminada)}
    <p class="section-label">Paciente y equipo médico</p>
    ${row("Paciente", s.paciente)}
    ${row("Edad del paciente", s.edadPaciente)}
    ${row("Cirujano responsable", s.cirujano)}
    ${row("Cirujano ayudante", s.ayudante)}
    ${row("Anestesiólogo/a", s.anestesiologo)}
    ${row("Email del médico", s.email)}
    ${row("¿Quién realiza los pagos?", s.pagos)}
    <p class="section-label">Materiales e insumos</p>
    ${row("Suturas", s.suturas)}
    ${row("Drenaje", s.drenaje)}
    ${row("Insumos especiales", s.insumos)}
    ${row("Equipo de laparoscopia", s.laparoscopia)}
    ${s.notas ? row("Notas", s.notas) : ""}
  `;
  const footer = document.getElementById("modal-footer");
  const calStatus = status === "confirmado"
    ? (calSynced[id] ? '<div class="info-box">📅 Este evento ya está en Google Calendar.</div>' : '<div class="warning-box">⏳ Este evento aún no se ha sincronizado con Google Calendar.</div>')
    : "";
  footer.innerHTML = `
    ${status === "pendiente" ? `<div class="warning-box">⚠️ Verifica disponibilidad antes de confirmar.</div>${!gReady ? '<div class="info-box">🔗 Conecta tu Google Calendar antes de confirmar.</div>' : ""}` : ""}
    ${calStatus}
    <div class="modal-actions">
      <button class="btn-edit" onclick="openEdit(${id})">✏️ Editar</button>
      ${status !== "cancelado" ? `<button class="btn-cancel" onclick="handleCancel(${id})">🚫 Cancelar cirugía</button>` : ""}
      ${status === "pendiente" ? `
        <button class="btn-reject" onclick="handleReject(${id})">✕ Rechazar</button>
        <button class="btn-confirm" onclick="handleConfirm(${id})" ${!gReady ? "disabled" : ""}>✓ Confirmar y agendar</button>
      ` : ""}
    </div>`;
  document.getElementById("modal").style.display = "flex";
}

function closeModal() { document.getElementById("modal").style.display = "none"; }

// ── Edit modal ────────────────────────────────────────────────────────────────
function openEdit(id) {
  editingId = id;
  const s  = solicitudes.find(x => x.id === id);
  if (!s) return;
  const ed = editOverrides[id] || {};
  document.getElementById("e-nombre").value       = ed.nombreCirugia  || s.nombreCirugia  || "";
  document.getElementById("e-fecha").value        = ed.fecha          || s.fecha          || "";
  document.getElementById("e-horario").value      = ed.horario        || s.horario        || "";
  document.getElementById("e-cirujano").value     = ed.cirujano       || s.cirujano       || "";
  document.getElementById("e-anestesiologo").value= ed.anestesiologo  || s.anestesiologo  || "";
  document.getElementById("e-notas").value        = ed.notas          || s.notas          || "";
  const horasEl = document.getElementById("e-horas");
  const horasVal = ed.horasQuirofano || s.horasQuirofano || "";
  let m = false;
  for (let o of horasEl.options) { if (o.value === horasVal) { o.selected = true; m = true; break; } }
  if (!m) horasEl.selectedIndex = 0;
  const hospEl  = document.getElementById("e-hospitalizacion");
  const hospVal = ed.hospitalizacion || s.hospitalizacion || "";
  m = false;
  for (let o of hospEl.options) { if (o.value === hospVal) { o.selected = true; m = true; break; } }
  if (!m) hospEl.selectedIndex = 0;
  document.getElementById("modal").style.display     = "none";
  document.getElementById("edit-modal").style.display = "flex";
}

function closeEdit() { document.getElementById("edit-modal").style.display = "none"; editingId = null; }

async function saveEdit() {
  if (!editingId) return;
  const now = new Date().toLocaleString("es-MX");
  const changes = {
    nombreCirugia:   document.getElementById("e-nombre").value,
    fecha:           document.getElementById("e-fecha").value,
    horario:         document.getElementById("e-horario").value,
    horasQuirofano:  document.getElementById("e-horas").value,
    hospitalizacion: document.getElementById("e-hospitalizacion").value,
    cirujano:        document.getElementById("e-cirujano").value,
    anestesiologo:   document.getElementById("e-anestesiologo").value,
    notas:           document.getElementById("e-notas").value,
    ultimaModificacion: now
  };
  editOverrides[editingId] = changes;
  const idx = solicitudes.findIndex(x => x.id === editingId);
  if (idx >= 0) solicitudes[idx] = { ...solicitudes[idx], ...changes };
  const s = solicitudes[idx];
  // Si ya estaba en Calendar, marcar como pendiente de re-sync
  if (calSynced[editingId]) { delete calSynced[editingId]; if (!calQueue.includes(editingId)) calQueue.push(editingId); }
  saveState(); closeEdit(); render();
  if (gReady && accessToken) {
    showToast("⏳ Actualizando evento en Calendar...", "info");
    try {
      const searchRes  = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?q=${encodeURIComponent(s.nombreCirugia)}&maxResults=10`, { headers: { Authorization: `Bearer ${accessToken}` } });
      const searchData = await searchRes.json();
      const existing   = searchData.items && searchData.items.find(e => e.summary && e.summary.includes(s.paciente));
      const evt        = { ...buildCalEvent(s), description: buildCalEvent(s).description + `\n\n📝 MODIFICACIÓN\n${s.notas}\nFecha de cambio: ${now}` };
      const r = existing
        ? await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${existing.id}?sendUpdates=all`, { method: "PUT", headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" }, body: JSON.stringify(evt) })
        : await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?sendUpdates=all`,                { method: "POST", headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" }, body: JSON.stringify(evt) });
      if (r.ok) { calSynced[editingId || idx+1] = true; calQueue = calQueue.filter(x => x !== (editingId || idx+1)); saveState(); render(); }
      showToast(r.ok ? "✓ Evento actualizado en Calendar." : "✓ Guardado. Error al actualizar Calendar.", r.ok ? "success" : "danger");
    } catch(e) { showToast("✓ Guardado. Error al conectar con Calendar.", "danger"); }
  } else {
    showToast("✓ Cambios guardados. Se sincronizará al reconectar Calendar.", "success");
  }
}

// ── Confirm ───────────────────────────────────────────────────────────────────
async function handleConfirm(id) {
  overrides[id] = "confirmado";
  if (!calQueue.includes(id)) calQueue.push(id);
  saveState(); closeModal(); render();
  if (gReady && accessToken) {
    showToast("📅 Creando evento en Calendar...", "info");
    const s   = solicitudes.find(x => x.id === id);
    const res = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?sendUpdates=all", {
      method: "POST", headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" }, body: JSON.stringify(buildCalEvent(s))
    });
    if (res.ok) { calSynced[id] = true; calQueue = calQueue.filter(x => x !== id); saveState(); render(); }
    showToast(res.ok ? `✓ Confirmado y agendado${s.email ? " — invitación enviada." : "."}` : "✓ Confirmado. El evento se sincronizará luego.", res.ok ? "success" : "danger");
  } else {
    showToast("✓ Confirmado. Se agendará al reconectar Calendar.", "info");
  }
}

// ── Cancel ────────────────────────────────────────────────────────────────────
async function handleCancel(id) {
  if (!confirm("¿Seguro que deseas cancelar esta cirugía?")) return;
  overrides[id] = "cancelado";
  calQueue = calQueue.filter(x => x !== id);
  saveState(); closeModal(); render();
  if (gReady && accessToken) {
    showToast("⏳ Actualizando evento en Calendar...", "info");
    try {
      const s          = solicitudes.find(x => x.id === id);
      const searchRes  = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?q=${encodeURIComponent(s.nombreCirugia)}&maxResults=10`, { headers: { Authorization: `Bearer ${accessToken}` } });
      const searchData = await searchRes.json();
      const existing   = searchData.items && searchData.items.find(e => e.summary && e.summary.includes(s.paciente));
      if (existing) {
        const r = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${existing.id}`, {
          method: "PATCH", headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
          body: JSON.stringify({ summary: `❌ [CANCELADO] ${existing.summary.replace("🏥 ","").replace("❌ [CANCELADO] ","")}`, colorId: "8", description: (existing.description||"") + `\n\n🚫 CANCELADO\nFecha: ${new Date().toLocaleString("es-MX")}` })
        });
        showToast(r.ok ? "🚫 Cancelada. Evento en Calendar cambiado a gris." : "🚫 Cancelada, error al actualizar Calendar.", r.ok ? "info" : "danger");
      } else { showToast("🚫 Cancelada. No se encontró evento en Calendar.", "info"); }
    } catch(e) { showToast("🚫 Cancelada. Error al conectar con Calendar.", "danger"); }
  } else { showToast("🚫 Cirugía cancelada.", "info"); }
}

// ── Reject ────────────────────────────────────────────────────────────────────
function handleReject(id) {
  overrides[id] = "rechazado";
  calQueue = calQueue.filter(x => x !== id);
  saveState(); closeModal(); render();
  showToast("Solicitud rechazada.", "danger");
}

// ── Filters ───────────────────────────────────────────────────────────────────
function setFiltro(f, btn) {
  filtroActual = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active"); render();
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast " + type; t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = "none", 4000);
}

// ── Google Auth ───────────────────────────────────────────────────────────────
function handleGoogleLogin() {
  if (tokenClient) tokenClient.requestAccessToken({ prompt: "select_account" });
}

let tokenExpiry = 0; // timestamp en ms cuando expira el token

async function onTokenReceived(resp) {
  if (resp.error) return;
  accessToken = resp.access_token;
  tokenExpiry = Date.now() + 55 * 60 * 1000; // 55 min (expira a los 60)
  try {
    const info = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", { headers: { Authorization: `Bearer ${accessToken}` } }).then(r => r.json());
    gUser = info.email;
    localStorage.setItem("mmg_gcal_user", gUser);
  } catch(e) {}
  gReady = true;
  document.getElementById("gauth-area").innerHTML = `<div class="connected-badge">✓ Calendar · ${gUser}</div>`;
  render();
  await processQueue();
  scheduleTokenRenewal();
}

function scheduleTokenRenewal() {
  clearInterval(renewalTimer);
  renewalTimer = setInterval(async () => {
    // Solo procesar cola, sin tocar el token ni abrir popups
    if (gReady && accessToken && Date.now() < tokenExpiry) {
      await processQueue();
    }
    // Si el token expiró, simplemente esperar a que el usuario reconecte manualmente
  }, 5 * 60 * 1000);
}

window.addEventListener("load", () => {
  loadState();
  fetchSheet();
  const interval = setInterval(() => {
    if (window.google) {
      clearInterval(interval);
      tokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, scope: SCOPES, callback: onTokenReceived
      });
      // NO intentar reconexión automática — evita popups no deseados
      // Si hay usuario guardado, mostrar botón de reconexión destacado
      if (localStorage.getItem("mmg_gcal_user")) {
        document.getElementById("gauth-area").innerHTML = `
          <button class="btn-google" onclick="handleGoogleLogin()" style="background:#fff8e6; border-color:#f0c040;">
            <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            ⚡ Reconectar Calendar
          </button>`;
      }
    }
  }, 300);
});
</script>
